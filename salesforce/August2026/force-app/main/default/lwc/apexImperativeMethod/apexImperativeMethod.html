<template>
    <lightning-card title="Apex Imperative Method">
        <div class="slds-m-aroud_medium">
            <p class="slds-m-buttom_small">
                <lightning-button label="Load Contacts" onclick={handleLoad}></lightning-button>
                <lightning-button label="Remove Contacts" onclick={handleLoadRemove}></lightning-button>

            </p>
         
<br>
            <template lwc:if={contacts}>

                <table style="border-collapse: collapse; width: auto ; margin-top: 1rem;">
                    <thead>
                        <tr>
                            <th style="border: 1px solid black; padding: 0.5rem;">Name</th>
                            <th style="border: 1px solid black; padding: 0.5rem;">Phone</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={contacts} for:item="contact">
                            <tr key={contact.id}>
                                <td style="border: 1px solid black; padding: 0.5rem;">{contact.Name}</td>
                                <td style="border: 1px solid black; padding: 0.5rem;">{contact.Phone}</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </template>

        </div>
    </lightning-card>
</template>
