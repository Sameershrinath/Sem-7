<template>
    <lightning-card title="Apex WIre Method To Property" icon-name="custom:custom63">
        <div class="slds-m-around_medium">
            <template lwc:if={contacts}>
                <template for:each={contacts} for:item="contact">
                    <p key={contact.Id}> {contact.Name}</p>
                </template>
            </template>
            <template lwc:else>
                <p>No contacts found {error}</p>
            </template>
        </div>
    </lightning-card>
    
</template>
